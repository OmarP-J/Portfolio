<a class="project-row" [routerLink]="['/projects', project.id]">
  <!-- 1 → "01" -->
  <span class="row-number">{{ index | number: '2.0-0' }}</span>

  <div class="row-main">
    <h3 class="row-title">{{ 'PROJECTS.ITEMS.' + project.id + '.NAME' | translate }}</h3>
    <p class="row-desc">{{ 'PROJECTS.ITEMS.' + project.id + '.DESC' | translate }}</p>
  </div>

  <div class="row-meta">
    <!-- Solo las 3 primeras tecnologías; la lista completa está en el detalle -->
    <ul class="tag-list">
      <li *ngFor="let tech of project.technologies | slice: 0 : 3">{{ tech }}</li>
    </ul>
    <span class="row-year">{{ project.created_at | date: 'yyyy' }}</span>
  </div>

  <span class="row-arrow" aria-hidden="true">→</span>
</a>
