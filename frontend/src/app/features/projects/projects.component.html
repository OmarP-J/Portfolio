<div class="container">
  <header class="page-header">
    <p class="eyebrow">{{ 'PROJECTS.EYEBROW' | translate }}</p>
    <h1>{{ 'PROJECTS.TITLE' | translate }}</h1>
    <p>{{ 'PROJECTS.SUBTITLE' | translate }}</p>

    <div class="tabs" role="tablist">
      <button role="tab" [class.active]="currentTab === 'projects'" [attr.aria-selected]="currentTab === 'projects'"
        (click)="setTab('projects')">
        {{ 'PROJECTS.TABS.PROJECTS' | translate }}
        <span *ngIf="!loading" class="tab-count">{{ projects.length }}</span>
      </button>
      <button role="tab" [class.active]="currentTab === 'certificates'"
        [attr.aria-selected]="currentTab === 'certificates'" (click)="setTab('certificates')">
        {{ 'PROJECTS.TABS.CERTIFICATES' | translate }}
        <span class="tab-count">{{ certificates.length }}</span>
      </button>
    </div>
  </header>

  <!-- Pestaña: proyectos -->
  <section *ngIf="currentTab === 'projects'">
    <p *ngIf="loading" class="status">{{ 'PROJECTS.LOADING' | translate }}</p>

    <div *ngIf="error" class="status">
      <p>{{ 'PROJECTS.ERROR' | translate }}</p>
      <button class="link-arrow" (click)="loadProjects()">{{ 'PROJECTS.RETRY' | translate }}</button>
    </div>

    <p *ngIf="!loading && !error && projects.length === 0" class="status">{{ 'PROJECTS.NO_PROJECTS' | translate }}</p>

    <ol *ngIf="!loading && !error" class="row-list">
      <li *ngFor="let project of projects; let i = index">
        <app-project-row [project]="project" [index]="i + 1"></app-project-row>
      </li>
    </ol>
  </section>

  <!-- Pestaña: certificados -->
  <section *ngIf="currentTab === 'certificates'">
    <ul class="cert-grid">
      <li *ngFor="let cert of certificates">
        <button class="cert" (click)="openCertificate(cert)">
          <img [src]="cert.image_url" [alt]="cert.name | translate" loading="lazy">
          <span class="cert-name">{{ cert.name | translate }}</span>
          <span class="cert-meta">{{ cert.issuer }} · {{ cert.date }}</span>
        </button>
      </li>
    </ul>
  </section>
</div>

<!-- Certificado en grande. Se cierra con clic fuera, con el botón o con Escape -->
<div *ngIf="selectedCertificate" class="lightbox" (click)="closeCertificate()">
  <figure class="lightbox-content" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">
    <button class="lightbox-close" (click)="closeCertificate()">{{ 'PROJECTS.CLOSE' | translate }}</button>
    <img [src]="selectedCertificate.image_url" [alt]="selectedCertificate.name | translate">
    <figcaption>
      <p class="cert-name">{{ selectedCertificate.name | translate }}</p>
      <p class="cert-meta">{{ selectedCertificate.issuer }} · {{ selectedCertificate.date }}</p>
      <a *ngIf="selectedCertificate.url" [href]="selectedCertificate.url" target="_blank" rel="noopener"
        class="link-arrow">
        {{ 'PROJECTS.CERTIFICATES.VIEW' | translate }} ↗
      </a>
    </figcaption>
  </figure>
</div>
