<div class="projects-container">
  <section class="projects-hero">
    <h1>My Projects</h1>
    <p class="subtitle">A showcase of my work and technical expertise</p>
  </section>
  
  <section class="projects-content">
    <div *ngIf="loading" class="loading">
      <div class="spinner"></div>
      <p>Loading projects...</p>
    </div>
    
    <div *ngIf="error" class="error-message">
      <p>{{ error }}</p>
      <button (click)="loadProjects()" class="retry-btn">Retry</button>
    </div>
    
    <div *ngIf="!loading && !error && projects.length > 0" class="projects-grid">
      <app-project-card *ngFor="let project of projects" [project]="project"></app-project-card>
    </div>
    
    <div *ngIf="!loading && !error && projects.length === 0" class="no-projects">
      <p>No projects found.</p>
    </div>
  </section>
</div>
